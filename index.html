<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpeaks - Know your Alps!</title>
    <link rel="icon" type="image/x-icon" href="img/favicon.png">
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="game-container">
        <div class="header" id="header">
            <h1>🏔️ Alpeaks 🏔️</h1>
            <p>Know your Alps!</p>
        </div>

        <div class="game-content">
            <div id="region-selection" class="region-selector">
                <h2>Choose Your Region</h2>
                <div class="region-grid" id="region-grid">
                    <!-- Buttons will be generated by JavaScript -->
                </div>
            </div>
                <div id="custom-region-selector" class="custom-region-selector" style="display: none;">
                    <h3>Select Custom Region</h3>
                    <p>Click two corners for your zone !</p>
                    <div class="custom-map-container">
                        <div id="custom-map"></div>
                    </div>
                    <div class="custom-controls">
                        <button class="btn" id="submit-custom" disabled>Submit Region</button>
                        <button class="btn btn-danger" id="cancel-custom">Cancel</button>
                    </div>
                </div>


            <div id="loading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Loading peaks data...</p>
            </div>

            <div id="endgame"></div>
            
            <div id="game-area" class="game-area">
                <div class="game-header">
                    <div class="current-peak">
                      <div class="peak-name" id="peak-name">Peak Name</div>
                      <div class="peak-info" id="peak-info">Elevation: 0m | Prominence: 0m</div>
                    </div>
                    <div class="game-controls">
                      <button class="btn btn-danger" id="quit-game">Quit</button>
                      <button class="btn" id="validate-guess" disabled>Submit</button>
                      <!-- <button class="btn" id="skip-question">Skip</button> -->
                                              
                    </div>
                </div>

                <div class="map-container">
                    <div id="map"></div>
                </div>

                <div class="score-board" id="sb">
                  <div class="score-item">
                    <div class="score-value" id="current-question">1</div>
                    <div class="score-label">Question</div>
                  </div>
                  <div class="score-item">
                    <div class="score-value" id="score">0</div>
                    <div class="score-label">Score</div>
                  </div>
                  <div class="score-item">
                    <div class="score-value" id="streak">0</div>
                    <div class="score-label">Streak</div>
                  </div>
                </div>

                <div id="feedback" class="feedback" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="alpeaks.js"> </script>
</body>
</html>
